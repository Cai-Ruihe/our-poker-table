name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The serial Chromium, Android-like Chromium, and WebKit journey suite
    # needs a measured Linux allowance. This is a ceiling, not a reduced QA
    # gate: every existing verification step still runs before deployment.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repository
        run: pnpm check
      - name: Verify measured source coverage
        run: pnpm test:coverage
      - name: Audit production dependencies
        run: pnpm audit:prod
      - name: Install browser engines for journey tests
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify browser journeys
        run: pnpm qa:browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-evidence-${{ github.run_id }}
          path: |
            test-results/playwright
            playwright-report
          if-no-files-found: error
          retention-days: 14

  deploy-party-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build release artifacts
        run: pnpm build:multiplayer
      - name: Build relay fixture for packaged connection checks
        run: pnpm build:service
      - name: Configure hosted Multiplayer
        env:
          TABLE_SIDE_CLOUD_RELAY_URL: ${{ vars.TABLE_SIDE_CLOUD_RELAY_URL }}
          TABLE_SIDE_MAC_RELAY_URL: ${{ vars.TABLE_SIDE_MAC_RELAY_URL }}
          TABLE_SIDE_CONNECTION_SERVICE_URL: ${{ vars.TABLE_SIDE_CONNECTION_SERVICE_URL }}
        run: pnpm release:configure-multiplayer
      - name: Verify configured live relay
        if: vars.TABLE_SIDE_CLOUD_RELAY_URL != '' || vars.TABLE_SIDE_MAC_RELAY_URL != '' || vars.TABLE_SIDE_CONNECTION_SERVICE_URL != ''
        env:
          TABLE_SIDE_APP_ORIGIN: ${{ vars.TABLE_SIDE_APP_ORIGIN || format('https://{0}.github.io', github.repository_owner) }}
          TABLE_SIDE_CLOUD_RELAY_URL: ${{ vars.TABLE_SIDE_CLOUD_RELAY_URL }}
          TABLE_SIDE_MAC_RELAY_URL: ${{ vars.TABLE_SIDE_MAC_RELAY_URL }}
          TABLE_SIDE_CONNECTION_SERVICE_URL: ${{ vars.TABLE_SIDE_CONNECTION_SERVICE_URL }}
        run: pnpm qa:live-relay
      - name: Fetch pinned Phase 1 deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node -p "require('./deploy/phase-channels.json').phase1.releaseTag")
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern phase1-site.tar.gz --dir "$RUNNER_TEMP/retained-phase1"
      - name: Assemble independently selected phase artifacts
        run: node tools/release/assemble-phase-site.mjs "$RUNNER_TEMP/retained-phase1/phase1-site.tar.gz"
      - name: Install preview test browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify both packaged phase paths before deployment
        run: pnpm exec playwright test --config playwright.phase-release.config.ts
      - name: Preserve packaged browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-browser-failure-evidence-${{ github.run_id }}
          path: test-results/phase-release
          if-no-files-found: warn
          retention-days: 14
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
