name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The serial Chromium, Android-like Chromium, and WebKit journey suite
    # needs a measured Linux allowance. This is a ceiling, not a reduced QA
    # gate: every existing verification step still runs before deployment.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repository
        run: pnpm check
      - name: Verify measured source coverage
        run: pnpm test:coverage
      - name: Audit production dependencies
        run: pnpm audit:prod
      - name: Install browser engines for journey tests
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify browser journeys
        run: pnpm qa:browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-evidence-${{ github.run_id }}
          path: |
            test-results/playwright
            playwright-report
          if-no-files-found: error
          retention-days: 14

  deploy-party-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build release artifacts
        run: pnpm build:normal && pnpm build:cloudflare-relay && pnpm build:airplane
      - name: Configure hosted Normal Mode
        env:
          NORMAL_CLOUD_RELAY_URL: ${{ vars.NORMAL_CLOUD_RELAY_URL }}
          NORMAL_MAC_RELAY_URL: ${{ vars.NORMAL_MAC_RELAY_URL }}
          NORMAL_CONNECTION_SERVICE_URL: ${{ vars.NORMAL_CONNECTION_SERVICE_URL }}
        run: pnpm release:configure-normal
      - name: Verify configured live relay
        if: vars.NORMAL_CLOUD_RELAY_URL != '' || vars.NORMAL_MAC_RELAY_URL != '' || vars.NORMAL_CONNECTION_SERVICE_URL != ''
        env:
          NORMAL_APP_ORIGIN: ${{ vars.NORMAL_APP_ORIGIN || format('https://{0}.github.io', github.repository_owner) }}
          NORMAL_CLOUD_RELAY_URL: ${{ vars.NORMAL_CLOUD_RELAY_URL }}
          NORMAL_MAC_RELAY_URL: ${{ vars.NORMAL_MAC_RELAY_URL }}
          NORMAL_CONNECTION_SERVICE_URL: ${{ vars.NORMAL_CONNECTION_SERVICE_URL }}
        run: pnpm qa:live-relay
      - name: Create release receipt
        run: pnpm release:manifest
      - name: Package canonical party site
        run: |
          mkdir -p _site/normal
          cp dist/airplane/poker-airplane.html _site/index.html
          cp dist/airplane/poker-airplane.html _site/poker-airplane.html
          cp -R dist/normal/. _site/normal/
          cp dist/release/phase-1-manifest.json _site/phase-1-manifest.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
