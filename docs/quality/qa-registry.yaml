control_contract:
  sources:
    - apps/web/src/app.tsx
    - packages/presentation/src/index.tsx
  evidence_marker: exerciseControl
  controls:
    home-chip-mode-physical:
      surface: Home
      expected_result: Physical-chip rules are selected.
      evidence: tests/journey/control-conformance.spec.ts
    home-chip-mode-digital:
      surface: Home
      expected_result: Digital-chip settings and validation are shown.
      evidence: tests/journey/control-conformance.spec.ts
    card-style-classic:
      surface: Host Table control center
      expected_result: The table uses the synchronized Classic deck presentation.
      evidence: tests/journey/feedback-regressions.spec.ts
    card-style-four-colour:
      surface: Host Table control center
      expected_result: The table uses the synchronized Four Colour deck presentation.
      evidence: tests/journey/feedback-regressions.spec.ts
    host-dissolve-table:
      surface: Host Table control center
      expected_result: After explicit confirmation, the Trusted Host closes the table, revokes invitations and credentials, erases recoverable authority state, and returns home.
      evidence: tests/journey/feedback-regressions.spec.ts
    host-dissolve-table-drawer:
      surface: Table-side Host Players drawer
      expected_result: The always-visible drawer-header action requests explicit confirmation; after confirmation, the Trusted Host closes the table, revokes invitations and credentials, erases recoverable authority state, and returns home.
      evidence: tests/journey/feedback-regressions.spec.ts
    home-create-table:
      surface: Home
      expected_result: A Trusted Host lobby is created.
      evidence: tests/journey/control-conformance.spec.ts
    home-join-airplane:
      surface: Airplane Home
      expected_result: The player Airplane pairing flow opens.
      evidence: tests/journey/control-conformance.spec.ts
    home-pair-display:
      surface: Table-side Mode Home
      expected_result: The display-role pairing flow opens.
      evidence: tests/journey/table-side-relay.spec.ts
    home-open-invitation:
      surface: Home
      expected_result: The pasted invitation opens the join form.
      evidence: tests/journey/control-conformance.spec.ts
    home-scan-invitation:
      surface: Home
      expected_result: The in-page invitation scanner opens.
      evidence: tests/journey/control-conformance.spec.ts
    qr-camera-close:
      surface: QR scanner
      expected_result: The active scanner closes.
      evidence: tests/journey/control-conformance.spec.ts
    qr-camera-file:
      surface: QR scanner
      expected_result: A saved QR image is decoded or a visible error is returned.
      evidence: tests/journey/control-conformance.spec.ts
    airplane-offer-enlarge:
      surface: Airplane Host
      expected_result: The selected role offer opens as an enlarged QR.
      variants: [player, public-table, tv, table-control]
      evidence: tests/journey/control-conformance.spec.ts
    airplane-offer-prepare:
      surface: Airplane Host
      expected_result: A fresh one-use offer QR is rendered for the selected role.
      variants: [player, public-table, tv, table-control]
      evidence: tests/journey/control-conformance.spec.ts
    airplane-answer-scan:
      surface: Airplane Host
      expected_result: The answer scanner opens for the selected role offer.
      variants: [player, public-table, tv, table-control]
      evidence: tests/journey/control-conformance.spec.ts
    airplane-offer-enlarge-close:
      surface: Airplane Host
      expected_result: The enlarged offer returns to pairing controls.
      evidence: tests/journey/control-conformance.spec.ts
    host-open-join-window:
      surface: Host administration
      expected_result: The Table-side Host exposes an in-view Add a player QR and fresh one-use link.
      evidence:
        [
          tests/journey/control-conformance.spec.ts,
          tests/journey/feedback-regressions.spec.ts,
        ]
    player-invitation-copy:
      surface: Host invitation
      expected_result: The active player invitation is copied.
      evidence: tests/journey/control-conformance.spec.ts
    player-invitation-refresh:
      surface: Host invitation
      expected_result: The old player invitation is replaced.
      evidence: tests/journey/control-conformance.spec.ts
    role-invitation-create:
      surface: Host displays
      expected_result: A role-limited invitation is created.
      variants: [public-table, tv, table-control]
      evidence: tests/journey/control-conformance.spec.ts
    role-invitation-copy:
      surface: Host displays
      expected_result: The selected role invitation is copied.
      variants: [public-table, tv, table-control]
      evidence: tests/journey/control-conformance.spec.ts
    role-invitation-replace:
      surface: Host displays
      expected_result: The selected role invitation is rotated.
      variants: [public-table, tv, table-control]
      evidence: tests/journey/control-conformance.spec.ts
    role-invitation-use-this-device:
      surface: Host displays
      expected_result: The Trusted Host reuses its current document as the selected quiet display without minting or upgrading a capability.
      variants: [tv, table-control]
      evidence: tests/journey/control-conformance.spec.ts
    table-side-display-pair-file:
      surface: Host displays
      expected_result: A saved display request is decoded or rejected visibly.
      evidence: tests/journey/table-side-relay.spec.ts
    relay-ticket-refresh:
      surface: Host recovery
      expected_result: A fresh table-limited relay ticket is installed.
      evidence: tests/journey/relay-restart.spec.ts
    roster-join-window-toggle:
      surface: Host roster
      expected_result: The Table-side Host's explicit New players switch changes between Locked and Open and exposes the matching invitation result.
      evidence:
        [
          tests/journey/control-conformance.spec.ts,
          tests/journey/feedback-regressions.spec.ts,
        ]
    roster-map-seat:
      surface: Host roster table map
      expected_result: Selecting a mapped player opens that player's management panel.
      evidence: tests/journey/control-conformance.spec.ts
    roster-seat-move-up:
      surface: Host roster
      expected_result: The selected seat moves one place upward.
      evidence: tests/journey/control-conformance.spec.ts
    roster-seat-move-down:
      surface: Host roster
      expected_result: The selected seat moves one place downward.
      evidence: tests/journey/control-conformance.spec.ts
    roster-make-dealer:
      surface: Host roster
      expected_result: The selected eligible seat becomes dealer.
      evidence: tests/journey/control-conformance.spec.ts
    roster-replace-device:
      surface: Host roster
