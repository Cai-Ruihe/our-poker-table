stable_id_sources:
  decisions:
    file: docs/prd/reference/DECISION-REGISTER.md
    pattern: "^[|] ([A-Z][A-Z0-9-]+)"
    evidence: docs/prd/reference/DECISION-REGISTER.md
  tablet_ui:
    file: docs/design/TABLET-UI-FEEDBACK-2026-08-16.md
    pattern: "TUI-[0-9]{3}"
    evidence: tests/journey/visual-conformance.spec.ts
  field_feedback:
    file: docs/quality/FIELD-FEEDBACK-LEDGER.md
    pattern: "^[|] `([A-Z][A-Z0-9-]+-[0-9]{3})`"
    evidence: tests/journey/feedback-regressions.spec.ts

live_relay_contract:
  command: pnpm qa:live-relay
  package_script: qa:live-relay
  checker: tools/release/check-live-relay.mjs
  test: tests/contract/live-relay-release-gate.test.ts
  workflow: .github/workflows/ci.yml
  required_checks: [dns, health, exact-origin-cors, invalid-token-rejection]
  optional_owner_check: operator-token-acceptance

self_hosting_contract:
  guide: docs/operations/TABLE-SIDE-MODE-SELF-HOSTING.md
  compose: deploy/table-side/compose.yaml
  environment_template: deploy/table-side/.env.example
  dockerfile: services/connection-service/Dockerfile
  token_tool: tools/operations/create-relay-token.mjs
  test: tests/contract/table-side-self-hosting.test.ts
  configuration_test: tests/contract/table-side-release-config.test.ts
  token_script: relay:create-token
  doctor_script: relay:doctor
  unconfigured_behavior: no-relay
  ownership: deployer

brand_contract:
  authority: docs/design/brand/README.md
  canonical_assets: assets/brand
  manifest_verifier: tools/branding/verify-brand-assets.mjs
  product_name: Our Poker Table
  retained_technical_identifiers: [html-poker-app, "@html-poker/*", html-poker]
  required_surfaces:
    - entry-header
    - host-lobby-header
    - player-join-header
    - display-pairing-header
    - in-hand-host-header
    - browser-title
    - favicon
    - standalone-airplane-title
  evidence:
    - tests/journey/branding.spec.ts
    - tests/journey/airplane.spec.ts
    - tests/journey/feedback-regressions.spec.ts

visual_contract:
  reference_viewport: { width: 1366, height: 1024 }
  viewports:
    - { id: phone-small, width: 360, height: 780 }
    - { id: phone-ios, width: 393, height: 852 }
    - { id: phone-android-wide, width: 412, height: 915 }
    - { id: tablet-landscape, width: 1366, height: 1024 }
    - { id: desktop, width: 1440, height: 1000 }
    - { id: tv, width: 1920, height: 1080 }
  themes: [dark-green, black-gold, deep-navy]
  tablet_states:
    [
      quiet,
      lower-quick,
      upper-quick,
      fullscreen-quick,
      showdown,
      secondary,
      manage-players,
    ]
  fullscreen:
    applies_to: tablet-page-fullscreen-only
    protected_launcher_corner: upper-left
    panel_edge_flush: true
  showdown:
    preserve_quiet_board_geometry: true
    explanation: directly-below-board
  player_management_map:
    table_shape: landscape-rectangle
    seat_counts: [2, 6, 10]
    position_source: tableSeatPosition
    community_card_outlines: 5
    selected_seat_controls: true
  tablet_capacity:
    max_shown_players: 10
    shown_hole_cards: 20
    clear_of: [community-board, role-indicators, status-indicators]
  tv_viewing:
    model: wall-mounted
    card_orientation: viewer-upright
    indicator_orientation: viewer-upright
  cross_browser_phone:
    projects: [chromium, mobile-webkit]
    viewports: [phone-small, phone-ios, phone-android-wide]
    required:
      - phone-player-board-minimal-cards
      - phone-four-colour-deck
  geometry:
    quick_panel: { width: 650, height: 244, tolerance: 2 }
    utility_target: { width: 52, height: 52, tolerance: 1 }
    utility_gap: { value: 20, tolerance: 1 }
    action_gap: { value: 18, tolerance: 1 }
    next_card: { width: 190, height: 102, tolerance: 2 }
    next_hand: { width: 374, height: 102, tolerance: 2 }
    slider_track: { width: 156, height: 64, tolerance: 1 }
    slider_handle: { width: 64, height: 64, tolerance: 1 }
    slider_travel: { value: 92, tolerance: 1 }
    slider_radius: { value: 32, tolerance: 1 }
    gold_thread: { value: 4, tolerance: 0.5 }
  rejected_text: [Board, END, More, Unlock]
  rejected_symbols: [native-range, lock, pause-bars, broken-ring]

